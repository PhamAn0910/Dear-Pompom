name: Build WebGL and deploy to GitHub Pages

on:
  push:
    # main builds and deploys. v2/** branches build only, to catch compile errors
    # (there is no Unity Editor on the dev machine) without touching the live site.
    branches: [main, 'v2/**']
    # A docs-only change does not need a 20-minute Unity build.
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Every asset has a .meta file
        run: python3 Tools/gen_meta.py --check
      - name: Unit tests for DearPompom.Core
        run: dotnet test Tools/CoreTests --nologo
      - name: Type-check Unity scripts against stubs
        run: dotnet build Tools/UnityTypecheck --nologo

  build:
    name: Build WebGL
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 6000.1.3f1
          buildName: DearPompom
          buildsPath: build

      - name: Prepare site
        run: |
          sudo chown -R "$USER" build
          ls -R build/WebGL | head -50
          touch build/WebGL/DearPompom/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/WebGL/DearPompom

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
